<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI AFYA PRO – Natural Molecular Prototype</title>
    <!-- Marked.js kwa Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #010409;
            --emerald: #10b981;
            --emerald-soft: rgba(16, 185, 129, 0.1);
            --card-bg: rgba(13, 17, 23, 0.9);
            --border: rgba(48, 54, 61, 1);
            --text-light: #e6edf3;
            --text-dim: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            padding: 15px;
            min-height: 100vh;
            line-height: 1.8;
        }

        .container { max-width: 950px; margin: 0 auto; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .header h1 { font-size: 1.5rem; font-weight: 800; }
        .header h1 span { color: var(--emerald); }
        .stats { font-size: 0.75rem; background: var(--emerald-soft); padding: 8px 18px; border-radius: 50px; color: var(--emerald); border: 1px solid var(--emerald); font-weight: bold; }

        /* SEARCH BOX */
        .search-area {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }
        .search-area h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--emerald); }
        .search-box { display: flex; gap: 12px; flex-wrap: wrap; }
        .search-box input {
            flex: 1; padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 12px; color: white; font-size: 1rem; min-width: 250px; outline: none;
        }
        .search-box input:focus { border-color: var(--emerald); }
        .search-box .btn {
            padding: 16px 35px; background: var(--emerald); color: white; border: none;
            border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .search-box .btn:hover { background: #059669; }

        /* OUTPUT STYLING */
        .results { display: none; margin-top: 20px; animation: fadeIn 0.6s ease; }
        .results.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .output-content h1 { font-size: 1.8rem; color: var(--emerald); margin: 30px 0; text-align: center; font-weight: 800; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .output-content h2 { font-size: 1.4rem; color: #fcd34d; margin: 40px 0 20px 0; padding-left: 15px; border-left: 6px solid #fcd34d; }
        .output-content h3 { font-size: 1.2rem; color: #60a5fa; margin: 25px 0 15px 0; }
        .output-content p { margin-bottom: 20px; color: #cbd5e1; }

        /* TABLES */
        .output-content table {
            width: 100%; border-collapse: collapse; margin: 25px 0; background: rgba(255, 255, 255, 0.02);
            border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
        }
        .output-content th { background: #161b22; color: var(--emerald); padding: 18px; text-align: left; font-size: 0.85rem; border-bottom: 2px solid var(--border); }
        .output-content td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 0.95rem; vertical-align: top; color: #c9d1d9; }
        
        /* WARNING BOX */
        .warning-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); border-left: 6px solid #ef4444; padding: 25px; border-radius: 12px; margin: 30px 0; color: #fca5a5; }

        /* LOADER */
        .loading { display: none; text-align: center; padding: 60px; }
        .loading.active { display: block; }
        .spinner { border: 4px solid rgba(16, 185, 129, 0.1); border-top: 4px solid var(--emerald); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .action-bar { display: flex; gap: 12px; margin-top: 50px; padding: 30px 0; border-top: 1px solid var(--border); }
        .btn-sec { padding: 12px 25px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: white; border-radius: 10px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; }
        .btn-sec:hover { border-color: var(--emerald); background: var(--emerald-soft); }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.1rem; }
            .output-content table { font-size: 0.8rem; }
            .search-box .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>🧪 AI AFYA <span>PRO</span></h1>
            <div class="stats" id="statusDot">Mfumo Tayari</div>
        </header>

        <section class="search-area">
            <h2>🔬 Reverse-Engineering ya Molekuli kwenda Tiba Asili</h2>
            <div class="search-box">
                <input type="text" id="diseaseInput" placeholder="Andika ugonjwa hapa (mfano: Nguvu za kiume, Sukari, Presha)..." value="Nguvu za kiume">
                <button class="btn" id="analyzeBtn">ANZA UCHAMBUZI</button>
            </div>
        </section>

        <!-- LOADER -->
        <div class="loading" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--emerald); font-weight: bold; letter-spacing: 2px;">INACHAKATA MOLEKULI NA FORMULA...</p>
        </div>

        <!-- RESULTS -->
        <div class="results" id="results">
            <div class="output-content" id="output"></div>
            <div class="action-bar">
                <button class="btn-sec" onclick="copyText()">📋 Nakili Matokeo</button>
                <button class="btn-sec" onclick="window.print()">🖨️ Chapisha</button>
                <button class="btn-sec" onclick="clearAll()">🗑️ Safisha</button>
            </div>
        </div>

        <footer style="text-align: center; color: #484f58; font-size: 0.7rem; margin-top: 60px; padding-bottom: 40px; letter-spacing: 1px;">
            &copy; 2026 AI AFYA PRO | MOLECULAR REVERSE-ENGINEERING SYSTEM
        </footer>
    </div>

    <script>
        const CONFIG = {
            MISTRAL_KEY: 'Si1pSiecs294XjaZmbapcd6WSamrGqAy' // Funguo yako ya Mistral
        };

        async function analyze() {
            const disease = document.getElementById('diseaseInput').value;
            if(!disease) return;

            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const output = document.getElementById('output');
            const statusDot = document.getElementById('statusDot');

            loader.classList.add('active');
            results.classList.remove('active');
            statusDot.innerText = "⏳ Inatafuta Formula...";
            statusDot.style.color = "#f59e0b";

            // SYSTEM PROMPT ILIYOBORESHWA
            const systemPrompt = `Wewe ni AI Bingwa wa Elimu ya Dawa (Pharmacology) na Tiba za Asili.
            Unapopewa ugonjwa wa "${disease}", fanya yafuatayo:

            1. Taja DAWA 5 BORA zaidi za hospitalini duniani.
            2. Kwa kila dawa: 
               - Toa Chemical Formula sahihi.
               - Orodhesha viambata (Ingredients) na Historia fupi.
               - **Natural Prototype:** Fanya Reverse-Engineering kwa kutafuta mimea au vitu asilia vyenye kemia (Active compounds) inayofanana na dawa hiyo. 
            
            3. ## 🧑‍🌾 MWONGOZO WA MAANDALIZI NYUMBANI (3x3 GUIDE)
               Tumia MAJEDWALI ya Markdown yenye safu hizi: | Aina ya Maandalizi | Hatua kwa Hatua (Step-by-Step) | Matumizi na Kipimo |
               
               LUGHA NA VIPIMO:
               - Tumia Kiswahili Sanifu cha Kitanzania.
               - USITUMIE neno "chumvi" kwa vipimo vya vijiko. Tumia: "Kijiko cha Chai" (Teaspoon) au "Kijiko cha Chakula" (Tablespoon).
               - Kila mmea uandikwe kwa Kiswahili kisha mabano ya Kiingereza, mfano: Kitunguu Saumu (Garlic).
               - Maelezo yawe rahisi kama unamfundisha mama nyumbani.

            4. Mwishoni weka TAHADHARI ZA USALAMA kwenye box la onyo.`;

            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.MISTRAL_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-small-latest',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Chambua kwa usahihi wa hali ya juu ugonjwa wa: ${disease}` }
                        ],
                        temperature: 0.15
                    })
                });

                const data = await response.json();
                let text = data.choices[0].message.content;

                // Kutengeneza Warning Box maalum
                text = text.replace(/TAADHARI ZA USALAMA|TAHADHARI ZA USALAMA/g, '<div class="warning-box"><strong>⚠️ TAHADHARI ZA USALAMA:</strong>');
                if(text.includes('warning-box')) text += '</div>';

                output.innerHTML = marked.parse(text);
                
                loader.classList.remove('active');
                results.classList.add('active');
                statusDot.innerText = "✅ Tayari";
                statusDot.style.color = "#10b981";

            } catch (error) {
                console.error(error);
                alert("Hitilafu imetokea. Jaribu tena.");
                loader.classList.remove('active');
            }
        }

        function copyText() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text);
            alert("Imenakiliwa!");
        }

        function clearAll() {
            document.getElementById('results').classList.remove('active');
            document.getElementById('diseaseInput').value = '';
            document.getElementById('statusDot').innerText = "Mfumo Tayari";
        }

        document.getElementById('analyzeBtn').addEventListener('click', analyze);
        document.getElementById('diseaseInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') analyze();
        });
    </script>
</body>
</html>
