<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI AFYA – Mwongozo wa Tiba Asili</title>
    <!-- Marked.js kwa Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #020617;
            --emerald: #10b981;
            --emerald-soft: rgba(16, 185, 129, 0.1);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-light: #f1f5f9;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            padding: 16px;
            min-height: 100vh;
            line-height: 1.8; /* Nafasi kati ya mistari iliyoboreshwa */
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .header h1 { font-size: 1.4rem; font-weight: 600; color: white; }
        .header h1 b { color: var(--emerald); }
        .stats { font-size: 0.75rem; background: var(--emerald-soft); padding: 6px 16px; border-radius: 30px; color: var(--emerald); border: 1px solid var(--emerald); font-weight: bold; }

        /* SEARCH AREA */
        .search-area {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }
        .search-area h2 { font-size: 1.2rem; margin-bottom: 15px; font-weight: 500; color: var(--emerald); }
        .search-box { display: flex; gap: 12px; flex-wrap: wrap; }
        .search-box input {
            flex: 1; padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; color: white; font-size: 1rem; min-width: 250px; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--emerald); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
        .search-box .btn {
            padding: 16px 32px; background: var(--emerald); color: white; border: none;
            border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        }
        .search-box .btn:hover { background: #059669; transform: translateY(-2px); }

        /* SUGGESTIONS */
        .suggestions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .chip { background: rgba(255,255,255,0.05); padding: 8px 18px; border-radius: 50px; font-size: 0.8rem; cursor: pointer; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .chip:hover { background: var(--emerald-soft); border-color: var(--emerald); color: white; }

        /* RESULTS AREA */
        .results { display: none; margin-top: 30px; animation: fadeIn 0.6s ease; }
        .results.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* MPANGILIO WA MAJIBU (OUTPUT) */
        .output-content h1 { font-size: 1.7rem; color: var(--emerald); margin-bottom: 25px; text-align: center; border-bottom: 2px solid var(--emerald-soft); padding-bottom: 15px; }
        .output-content h2 { 
            font-size: 1.4rem; color: #fcd34d; margin: 40px 0 20px 0; padding: 12px 20px; 
            background: rgba(252, 211, 77, 0.1); border-left: 6px solid #fcd34d; border-radius: 4px; 
        }
        .output-content h3 { font-size: 1.2rem; color: #60a5fa; margin: 25px 0 15px 0; font-weight: 600; }
        .output-content p { margin-bottom: 20px; color: #cbd5e1; font-size: 1rem; }

        /* MAJEDWALI (TABLES) */
        .output-content table {
            width: 100%; border-collapse: collapse; margin: 25px 0; background: rgba(0, 0, 0, 0.3);
            border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .output-content th {
            background: #1e293b; color: var(--emerald); padding: 15px; text-align: left;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--emerald);
        }
        .output-content td {
            padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; vertical-align: top;
        }
        .output-content tr:hover { background: rgba(16, 185, 129, 0.05); }

        /* WARNING BOX */
        .warning-box { 
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); 
            border-left: 6px solid #ef4444; padding: 20px; border-radius: 12px; 
            margin: 30px 0; color: #fca5a5; font-size: 0.9rem; line-height: 1.6;
        }

        /* LOADING INDICATOR */
        .loading { display: none; text-align: center; padding: 50px; }
        .loading.active { display: block; }
        .spinner { border: 4px solid rgba(16, 185, 129, 0.1); border-top: 4px solid var(--emerald); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .action-bar { display: flex; gap: 12px; margin-top: 40px; padding-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-sec { padding: 12px 24px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
        .btn-sec:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--emerald); }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 1.1rem; }
            .output-content table { font-size: 0.8rem; }
            .output-content td, .output-content th { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>🧪 AI AFYA <b>Kitanzania</b></h1>
            <div class="stats" id="statusDot">Mfumo Tayari</div>
        </header>

        <section class="search-area">
            <h2>🔬 Tafuta Tiba na Maelekezo ya 3x3</h2>
            <div class="search-box">
                <input type="text" id="diseaseInput" placeholder="Andika ugonjwa hapa (mfano: Kisukari)..." value="Macho Kuwasha">
                <button class="btn" id="analyzeBtn">CHAMBUA</button>
            </div>
            <div class="suggestions">
                <span class="chip" onclick="quickSearch('Nguvu za kiume')">🍆 Nguvu za kiume</span>
                <span class="chip" onclick="quickSearch('Kisukari')">🩸 Kisukari</span>
                <span class="chip" onclick="quickSearch('Kikohozi')">🫁 Kikohozi</span>
                <span class="chip" onclick="quickSearch('Vidonda vya tumbo')">🩺 Vidonda vya tumbo</span>
            </div>
        </section>

        <!-- LOADING -->
        <div class="loading" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--emerald); font-weight: bold; letter-spacing: 1px;">AI INASAFISHA MAELEZO KWA KISWAHILI...</p>
        </div>

        <!-- RESULTS -->
        <div class="results" id="results">
            <div class="output-content" id="output"></div>
            <div class="action-bar">
                <button class="btn-sec" onclick="copyText()">📋 Nakili Yote</button>
                <button class="btn-sec" onclick="window.print()">🖨️ Chapisha</button>
                <button class="btn-sec" onclick="clearAll()">🗑️ Futa</button>
            </div>
        </div>

        <footer style="text-align: center; color: #475569; font-size: 0.75rem; margin-top: 50px; padding-bottom: 30px;">
            🧪 AI AFYA PRO | Teknolojia ya Kisasa kwa Tiba za Asili
        </footer>
    </div>

    <script>
        const CONFIG = {
            MISTRAL_KEY: 'Si1pSiecs294XjaZmbapcd6WSamrGqAy' 
        };

        async function analyze() {
            const disease = document.getElementById('diseaseInput').value;
            if(!disease) return;

            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const output = document.getElementById('output');
            const statusDot = document.getElementById('statusDot');

            loader.classList.add('active');
            results.classList.remove('active');
            statusDot.innerText = "⏳ Inachakata...";
            statusDot.style.color = "#f59e0b";

            // SYSTEM PROMPT ILIYOBORESHWA KWA KISWAHILI SANIFU NA MAJEDWALI
            const systemPrompt = `Wewe ni AI Bingwa wa Tiba na Elimu ya Afya nchini Tanzania. 
            Kazi yako ni kutoa mwongozo wa afya kwa ugonjwa wa "${disease}".

            MAAGIZO YA MUUNDO:
            1. Anza na uchambuzi mfupi wa kikemia wa dawa bora za hospitali.
            2. ## 🧑‍🌾 MWONGOZO RAHISI WA 3x3 (TIBA ZA NYUMBANI)
               Kwa kila sehemu hapa chini, tumia MAJEDWALI ya Markdown yenye safu hizi: | Njia | Maandalizi | Jinsi ya Kutumia |
               
               - **💧 Sehemu ya 1: MUUNDO WA MAJI (Chai au Matone):** Toa njia 3 tofauti.
               - **💊 Sehemu ya 2: MUUNDO WA VIDONGE/UNGA:** Toa njia 3 tofauti (mfano: kutengeneza vidonge vya asali au unga wa kunywa).
               - **🥗 Sehemu ya 3: MUUNDO WA LISHE (Chakula/Smoothie):** Toa njia 3 tofauti.

            MAAGIZO YA LUGHA:
            - Tumia Kiswahili Sanifu cha Tanzania ambacho ni rahisi na cha kirafiki.
            - Epuka maneno magumu ya kitaalamu pasipo lazima. 
            - Tumia maneno kama "Chemsha," "Ponda," "Saga," "Chuja," "Kunywa."
            - Maelezo yawe na nafasi (spacing) ya kutosha ili yasibanane.

            MWISHONI: Weka Box la onyo (Warning Box) kwa ajili ya TAHADHARI ZA USALAMA.`;

            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.MISTRAL_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-small-latest',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Nipe mwongozo wa ugonjwa wa: ${disease}` }
                        ],
                        temperature: 0.2
                    })
                });

                const data = await response.json();
                let text = data.choices[0].message.content;

                // Kutengeneza Warning Box maalum
                text = text.replace(/TAHADHARI ZA USALAMA/g, '<div class="warning-box"><strong>⚠️ TAHADHARI ZA USALAMA:</strong>');
                if(text.includes('warning-box')) text += '</div>';

                output.innerHTML = marked.parse(text);
                
                loader.classList.remove('active');
                results.classList.add('active');
                statusDot.innerText = "✅ Tayari";
                statusDot.style.color = "#10b981";

            } catch (error) {
                console.error(error);
                alert("Imeshindwa kuunganisha. Angalia mtandao wako.");
                loader.classList.remove('active');
            }
        }

        function quickSearch(val) {
            document.getElementById('diseaseInput').value = val;
            analyze();
        }

        function copyText() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text);
            alert("Maelezo yamenakiliwa!");
        }

        function clearAll() {
            document.getElementById('results').classList.remove('active');
            document.getElementById('diseaseInput').value = '';
        }

        document.getElementById('analyzeBtn').addEventListener('click', analyze);
        document.getElementById('diseaseInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') analyze();
        });
    </script>
</body>
</html>
