<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI AFYA – 3x3 Universal Healing</title>
    <!-- Marked.js kwa ajili ya Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* MSINGI WA RANGI NA FONTS */
        :root {
            --bg-dark: #020617;
            --emerald: #10b981;
            --emerald-soft: rgba(16, 185, 129, 0.1);
            --blue-soft: rgba(59, 130, 246, 0.1);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f1f5f9;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            padding: 16px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .header h1 { font-size: 1.3rem; font-weight: 300; display: flex; align-items: center; gap: 10px; }
        .header h1 b { color: var(--emerald); }
        .stats { font-size: 0.7rem; background: var(--emerald-soft); padding: 5px 15px; border-radius: 30px; color: var(--emerald); border: 1px solid var(--emerald); }

        /* SEARCH AREA */
        .search-area {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }
        .search-area h2 { font-size: 1.1rem; margin-bottom: 15px; font-weight: 400; color: var(--emerald); }
        .search-box { display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box input {
            flex: 1; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: white; font-size: 1rem; min-width: 250px; outline: none;
        }
        .search-box input:focus { border-color: var(--emerald); }
        .search-box .btn {
            padding: 15px 30px; background: var(--emerald); color: white; border: none;
            border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .search-box .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }

        /* SUGGESTIONS */
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .chip { background: rgba(255,255,255,0.05); padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; color: var(--text-dim); border: 1px solid transparent; }
        .chip:hover { border-color: var(--emerald); color: white; }

        /* RESULTS AREA */
        .results { display: none; margin-top: 20px; animation: fadeIn 0.5s ease; }
        .results.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* KADI ZA MATOKEO (3x3 Styling) */
        .output-content h1 { font-size: 1.6rem; color: var(--emerald); margin-bottom: 20px; border-bottom: 2px solid var(--emerald-soft); padding-bottom: 10px; }
        .output-content h2 { 
            font-size: 1.3rem; color: #fcd34d; margin: 30px 0 15px 0; padding: 10px 15px; 
            background: var(--emerald-soft); border-left: 5px solid var(--emerald); border-radius: 0 10px 10px 0; 
        }
        .output-content h3 { font-size: 1.1rem; color: #60a5fa; margin: 20px 0 10px 0; border-bottom: 1px dashed rgba(96, 165, 250, 0.3); padding-bottom: 5px; }
        
        .output-content p { margin-bottom: 15px; color: var(--text-dim); font-size: 0.95rem; }
        .output-content ul { list-style: none; margin-bottom: 20px; }
        .output-content li { 
            background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 10px; 
            margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem;
        }
        .output-content li strong { color: var(--emerald); }

        /* LOADING */
        .loading { display: none; text-align: center; padding: 40px; }
        .loading.active { display: block; }
        .spinner { border: 3px solid rgba(16, 185, 129, 0.1); border-top: 3px solid var(--emerald); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ACTION BUTTONS */
        .action-bar { display: flex; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-sec { padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        
        /* WARNING BOX */
        .warning-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-left: 5px solid #ef4444; padding: 15px; border-radius: 10px; margin: 20px 0; color: #fca5a5; font-size: 0.85rem; }

        @media (max-width: 600px) {
            .header h1 { font-size: 1rem; }
            .search-box input { min-width: 100%; }
            .search-box .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>🧪 AI AFYA <b>3x3 Universal</b></h1>
            <div class="stats" id="statusDot">Tayari</div>
        </header>

        <section class="search-area">
            <h2>🔬 Uchambuzi wa Dawa & Mwongozo wa 3x3</h2>
            <div class="search-box">
                <input type="text" id="diseaseInput" placeholder="Ingiza ugonjwa wowote..." value="Macho Kuwasha">
                <button class="btn" id="analyzeBtn">CHAMBUA SASA</button>
            </div>
            <div class="suggestions">
                <span class="chip" onclick="quickSearch('Nguvu za kiume')">🍆 Nguvu za kiume</span>
                <span class="chip" onclick="quickSearch('Kisukari')">🩸 Kisukari</span>
                <span class="chip" onclick="quickSearch('Kikohozi')">🫁 Kikohozi</span>
                <span class="chip" onclick="quickSearch('Macho Kuwasha')">👁️ Macho Kuwasha</span>
                <span class="chip" onclick="quickSearch('Shinikizo la Damu')">❤️ Shinikizo</span>
            </div>
        </section>

        <!-- LOADING INDICATOR -->
        <div class="loading" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--emerald); font-size: 0.9rem; letter-spacing: 1px;">AI INACHAKATA MOLEKULI NA MWONGOZO...</p>
        </div>

        <!-- RESULTS -->
        <div class="results" id="results">
            <div class="output-content" id="output"></div>
            <div class="action-bar">
                <button class="btn-sec" onclick="copyText()">📋 Nakili</button>
                <button class="btn-sec" onclick="window.print()">🖨️ Chapisha</button>
                <button class="btn-sec" onclick="clearAll()">🗑️ Futa</button>
            </div>
        </div>

        <footer style="text-align: center; color: #444; font-size: 0.7rem; margin-top: 40px; padding-bottom: 20px;">
            🧪 AI AFYA PRO | Molecular Science & Natural 3x3 Guide
        </footer>
    </div>

    <script>
        const CONFIG = {
            MISTRAL_KEY: 'Si1pSiecs294XjaZmbapcd6WSamrGqAy', // Funguo yako ya Mistral
            POLLINATION_KEY: 'sk_XnHMlGTSSKKMUkvVBGjHZB4gN30MBupw'
        };

        async function analyze() {
            const disease = document.getElementById('diseaseInput').value;
            if(!disease) return;

            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const output = document.getElementById('output');
            const statusDot = document.getElementById('statusDot');

            loader.classList.add('active');
            results.classList.remove('active');
            statusDot.innerText = "⏳ Inatafuta...";
            statusDot.style.color = "#f59e0b";

            // SYSTEM PROMPT KALI YA 3x3
            const systemPrompt = `Wewe ni AI Bingwa wa Farmasia na Natural Chemistry.
            Unapopewa ugonjwa, lazima ujibu kwa muundo huu kamili:

            1. Uchambuzi wa kikemia wa dawa bora ya kisasa (Hospitalini) ya ugonjwa huo.
            2. Reverse-Engineering ya molekuli hizo kwenda kwenye vyanzo vya asili.
            3. ## 🧑‍🌾 MWONGOZO RAHISISHWA 3x3 WA MATUMIZI YA NYUMBANI
               Hapa gawa katika sehemu 3 kuu:
               - **💧 1. MUUNDO WA MAJI (Liquid/Tea):** Toa Njia 1, Njia 2, na Njia 3.
               - **💊 2. MUUNDO WA VIDONGE/UNGA (Pills/Powder):** Toa Njia 1, Njia 2, na Njia 3.
               - **🥗 3. MUUNDO WA LISHE (Food/Smoothie):** Toa Njia 1, Njia 2, na Njia 3.

            SHERIA: 
            - Usitumie alama nyingi za bold (**). Tumia vichwa vya habari (Headers).
            - Lugha iwe Kiswahili fasaha.
            - Maelezo ya 3x3 yawe rahisi kwa mama ntilie au mzee wa kijijini kuelewa.
            - Mwishoni weka TAHADHARE YA USALAMA kwenye box la onyo.`;

            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.MISTRAL_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-small-latest',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Chambua ugonjwa wa: ${disease}` }
                        ],
                        temperature: 0.2
                    })
                });

                const data = await response.json();
                let text = data.choices[0].message.content;

                // Safisha HTML tags kama zipo na ubadilishe Warning Box
                text = text.replace(/TAHADHARE YA USALAMA/g, '<div class="warning-box"><strong>⚠️ TAHADHARE YA USALAMA:</strong>');
                if(text.includes('warning-box')) text += '</div>';

                output.innerHTML = marked.parse(text);
                
                loader.classList.remove('active');
                results.classList.add('active');
                statusDot.innerText = "✅ Tayari";
                statusDot.style.color = "#10b981";

            } catch (error) {
                console.error(error);
                alert("Hitilafu imetokea. Jaribu tena.");
                loader.classList.remove('active');
            }
        }

        function quickSearch(val) {
            document.getElementById('diseaseInput').value = val;
            analyze();
        }

        function copyText() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text);
            alert("Imenakiliwa!");
        }

        function clearAll() {
            document.getElementById('results').classList.remove('active');
            document.getElementById('diseaseInput').value = '';
        }

        document.getElementById('analyzeBtn').addEventListener('click', analyze);
        
        // Enter Key Support
        document.getElementById('diseaseInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') analyze();
        });
    </script>
</body>
</html>
